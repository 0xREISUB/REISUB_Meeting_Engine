<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REISUB Yönetim Girişi</title>
  <style>
    :root { color-scheme: dark; --bg: #101918; --panel: #192422; --line: #344641; --text: #edf4f1; --muted: #a1b1ab; --accent: #80d8b0; --danger: #ff7272; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--text); background: radial-gradient(ellipse at 15% 5%, #233631 0, transparent 42%), var(--bg); font: 15px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 390px); border: 1px solid var(--line); background: var(--panel); padding: 30px; box-shadow: 0 24px 70px #0006; }
    .mark { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--accent); color: var(--accent); font-size: 12px; font-weight: 800; }
    h1 { margin: 22px 0 4px; font-size: 23px; }
    p { margin: 0 0 24px; color: var(--muted); }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: #101918; color: var(--text); }
    button { width: 100%; min-height: 44px; margin-top: 16px; border: 0; border-radius: 3px; background: var(--accent); color: #10201a; font: inherit; font-weight: 700; cursor: pointer; }
    .error { margin-top: 14px; color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <div class="mark">RM</div>
    <h1>Yönetim paneli</h1>
    <p>REISUB Meeting servis yönetimi</p>
    <form method="post" action="/login">
      <label for="password">Admin parolası</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Giriş yap</button>
      {{if .Invalid}}<div class="error" role="alert">Parola geçersiz.</div>{{end}}
    </form>
  </main>
</body>
</html>
