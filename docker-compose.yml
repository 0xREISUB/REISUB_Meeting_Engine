name: reisub_meeting_engine

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      GIN_MODE: release
      PORT: ${PORT:-8080}
      DB_PATH: /data/reisub.db
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?Set LIVEKIT_PUBLIC_URL in .env}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      # Flutter web build uploaded by scripts/deploy-web.sh, served on the
      # same origin as the API.
      WEB_DIR: /web
      # Public origin of the web app; enables invite_url (<origin>/j/<room>).
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      # Android App Links (/.well-known/assetlinks.json); empty uses the
      # official app's package and signing certificate.
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_CERT_FINGERPRINTS: ${ANDROID_CERT_FINGERPRINTS:-}
      # Nginx Proxy Manager reaches the backend from a Docker network; trust
      # its X-Forwarded-For so per-IP limits see the real client.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Strict-Transport-Security max-age in seconds on HTTPS responses
      # (0 disables). Start short; raise only deliberately, HSTS cannot be
      # withdrawn quickly.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      # Guest sessions: token lifetime, and how long an unused guest is kept
      # (Go durations; empty uses the defaults 720h and 336h).
      GUEST_TOKEN_TTL: ${GUEST_TOKEN_TTL:-}
      GUEST_INACTIVE_AFTER: ${GUEST_INACTIVE_AFTER:-}
    # No published port: the backend is reachable only through Nginx Proxy
    # Manager (HTTPS) on proxy-agi, and from LiveKit on the default network.
    volumes:
      - backend_data:/data
      - ./web:/web:ro
    networks:
      default:
      # Nginx Proxy Manager forwards meeting.reisub.xyz and
      # api.meeting.reisub.xyz to reisub-meeting-backend:8080 on this network.
      proxy-agi:
        aliases:
          - reisub-meeting-backend
    depends_on:
      - livekit
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:${PORT:-8080}/ping
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: livekit-server
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          node_ip: "${LIVEKIT_NODE_IP:-}"
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          tcp_port: 7881
          udp_port: 7882
        room:
          auto_create: false
        # Room-owner succession needs participant_left/room_finished events.
        # LiveKit signs each call with this API key; the backend rejects
        # unsigned requests.
        webhook:
          api_key: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}"
          urls:
            - http://backend:${PORT:-8080}/livekit/webhook
        logging:
          level: info
    command:
      - --bind
      - 0.0.0.0
      - --keys
      - "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

volumes:
  backend_data:
    name: reisub-meeting-db
    external: true
networks:
  proxy-agi:
    external: true
    name: proxy-agi
